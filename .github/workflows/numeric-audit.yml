name: Audit form numerics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python tools/audit_form_numerics.py "${{ runner.temp }}/form-numerics"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: form-numerics-${{ matrix.os }}
          path: ${{ runner.temp }}/form-numerics
          retention-days: 7
