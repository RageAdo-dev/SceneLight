name: Build release ZIP

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SCENELIGHT_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      SCENELIGHT_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,preview]"
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: bandit -r src -ll
      - run: python -m pip_audit -r requirements-preview.txt --progress-spinner off
      - run: python -m build
      - name: Sign the bundled launchers
        if: env.SCENELIGHT_CERT_PFX != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'scenelight-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SCENELIGHT_CERT_PFX))
          try {
            $password = ConvertTo-SecureString -String $env:SCENELIGHT_CERT_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            foreach ($exe in @(
              'src\scenelight\assets\scenelight-desktop.exe',
              'src\scenelight\assets\scenelight-launcher.exe'
            )) {
              $signature = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert `
                -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
              if ($signature.Status -ne 'Valid') {
                throw "Signing failed for $exe ($($signature.Status))"
              }
              Write-Output "Signed $exe"
            }
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - name: Sign with Azure Artifact Signing
        if: env.TRUSTED_SIGNING_ACCOUNT != '' && env.TRUSTED_SIGNING_CERT_PROFILE != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found; install the Windows SDK first.' }
          $dlib = if ($env:TRUSTED_SIGNING_DLIB) { Get-Item -LiteralPath $env:TRUSTED_SIGNING_DLIB } else {
            Get-ChildItem -Path $env:ProgramFiles -Filter 'Azure.CodeSigning.Dlib.dll' -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          }
          if (-not $dlib) {
            throw 'Azure.CodeSigning.Dlib.dll was not found. Install the Trusted Signing client tools or set TRUSTED_SIGNING_DLIB.'
          }
          $metadata = Join-Path $env:RUNNER_TEMP 'scenelight-signing.json'
          @{
            Endpoint = if ($env:TRUSTED_SIGNING_ENDPOINT) { $env:TRUSTED_SIGNING_ENDPOINT } else { 'https://eus.codesigning.azure.net/' }
            CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
            CertificateProfileName = $env:TRUSTED_SIGNING_CERT_PROFILE
          } | ConvertTo-Json | Set-Content -LiteralPath $metadata -Encoding utf8
          foreach ($exe in @(
            'src\scenelight\assets\scenelight-desktop.exe',
            'src\scenelight\assets\scenelight-launcher.exe'
          )) {
            & $signtool.FullName sign /v /fd SHA256 /tr 'http://timestamp.acs.microsoft.com' /td SHA256 `
              /dlib $dlib.FullName /dmdf $metadata $exe
            if ($LASTEXITCODE -ne 0) { throw "Artifact Signing failed for $exe" }
            $signature = Get-AuthenticodeSignature -FilePath $exe
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $exe ($($signature.Status))" }
            Write-Output "Signed $exe"
          }
      - name: Build the tested ZIP variants with the verified compatibility runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SCENELIGHT_COMPATIBILITY_ROOT = Join-Path $env:RUNNER_TEMP 'scenelight-renpy'
          python -m scenelight.compatibility
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility runtime verification failed.' }
          .\tools\build_release_zip.ps1 -CompatibilityRuntime $env:SCENELIGHT_COMPATIBILITY_ROOT
          .\tools\build_release_zip.ps1 -Source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SceneLight-Windows
          path: |
            dist/SceneLight-v*-Windows.zip
            dist/SceneLight-v*-Windows.zip.sha256
            dist/SceneLight-v*-Windows-source.zip
            dist/SceneLight-v*-Windows-source.zip.sha256
            dist/scenelight_renpy-*.whl
            dist/scenelight_renpy-*.tar.gz
      - if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $existing = gh release view "$env:RELEASE_TAG" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Output "A release for $env:RELEASE_TAG already exists; leaving it untouched."
            exit 0
          }
          gh release create "$env:RELEASE_TAG" `
            dist/SceneLight-v*-Windows.zip `
            dist/SceneLight-v*-Windows.zip.sha256 `
            dist/SceneLight-v*-Windows-source.zip `
            dist/SceneLight-v*-Windows-source.zip.sha256 `
            dist/scenelight_renpy-*.whl `
            dist/scenelight_renpy-*.tar.gz `
            --generate-notes --draft --prerelease --verify-tag `
            --title "SceneLight $env:RELEASE_TAG"
