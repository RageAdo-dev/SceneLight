name: Bug report
description: Something rendered wrongly, crashed, or performed badly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove local paths from logs before pasting them here.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Preview & Calibrator
        - A game after SceneLight was installed
        - Setup or installation
        - Export
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and engine version
      description: For example, "DDLC mod, Ren'Py 7.7.1" or "original game, Ren'Py 8.5.3".
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Graphics hardware and driver
      description: The GPU reported in the SceneLight window, plus the driver version if you know it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the game
        2. Move the character to the left
        3. Lighting jumps between two states
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: A short recording at the moment the problem appears helps most.
    validations:
      required: false
