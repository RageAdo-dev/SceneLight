name: Feature request
description: Suggest a new control, workflow or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe where the current app gets in your way.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: Describe the change you would like. Screenshots or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How do you handle this now, if at all?
    validations:
      required: false
